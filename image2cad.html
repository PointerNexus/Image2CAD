<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片转 CAD 指令</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#f7f8fa;color:#111827;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:1280px;margin:0 auto;padding:22px 20px 44px}
header{display:flex;align-items:baseline;gap:10px;margin:0 2px 14px;flex-wrap:wrap}
h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.2px}
.sub{font-size:12.5px;color:#6b7280}
/* about: link parked at the far end of the header, plus a plain overlay.
   Solid dark pill so it reads as a control rather than dissolving into the
   grey chrome - 17.7:1 against white, versus 4.6:1 for grey-on-grey. */
.about-btn{margin-left:auto;align-self:center;font:inherit;font-size:12.5px;font-weight:500;
  color:#fff;background:#111827;border:1px solid #111827;border-radius:999px;
  padding:4px 14px;cursor:pointer;line-height:1.6;transition:background .12s,border-color .12s}
.about-btn:hover{background:#374151;border-color:#374151}
.about-btn:active{background:#1f2937;border-color:#1f2937}
.about-btn:focus-visible{outline:2px solid #111827;outline-offset:2px}
.about-mask{position:fixed;inset:0;background:rgba(17,24,39,.34);display:none;
  align-items:center;justify-content:center;padding:20px;z-index:50}
.about-mask.on{display:flex}
.about{background:#fff;border-radius:12px;box-shadow:0 18px 48px rgba(17,24,39,.22);
  max-width:420px;width:100%;padding:22px 24px 20px}
.about h2{font-size:15px;font-weight:600;margin:0 0 2px}
.about .ver{font-size:12.5px;color:#6b7280;margin:0 0 16px}
.about dl{margin:0;display:grid;grid-template-columns:76px minmax(0,1fr);gap:9px 12px;align-items:baseline}
.about dt{font-size:12.5px;color:#6b7280}
.about dd{margin:0;font-size:13px;min-width:0;overflow-wrap:anywhere}
.about dd a{color:#111827}
.about .close{margin-top:18px;width:100%;font:inherit;font-size:13px;padding:7px 0;cursor:pointer;
  background:#f3f4f6;border:1px solid #e5e7eb;border-radius:8px;color:#111827}
.about .close:hover{background:#e5e7eb}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:8px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 294px;gap:14px;align-items:start}
.preview{position:relative;overflow:hidden}
#view{display:block;width:100%;height:580px;background:#fcfcfd;cursor:grab}
#view.drag{cursor:grabbing}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.drop{width:100%;height:100%;border:1.5px dashed #d1d5db;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#6b7280;background:#fff;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:#9ca3af;background:#f9fafb}
.drop .big{font-size:14px;color:#374151}
.drop .small{font-size:12.5px}
.tools{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:8px}
.tools .meta{font-size:12px;color:#6b7280;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid #d1d5db;background:#fff;color:#111827;border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:#f3f4f6}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:#111827;border-color:#111827;color:#fff}
.btn.primary:hover:not(:disabled){background:#374151;border-color:#374151}
.seg{display:inline-flex;border:1px solid #d1d5db;border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;color:#6b7280;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.seg button+button{border-left:1px solid #e5e7eb}
.seg button.on{background:#111827;color:#fff}
.controls{overflow:hidden}
.group{padding:12px 15px;border-bottom:1px solid #f1f2f4}
.group:last-child{border-bottom:0}
.gtitle{font-size:11.5px;font-weight:600;color:#9ca3af;letter-spacing:.6px;margin-bottom:9px}
.row{margin-bottom:9px}
.row:last-child{margin-bottom:0}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.rhead label{font-size:12.5px;color:#374151}
.val{font-size:12px;color:#6b7280;font-variant-numeric:tabular-nums}
.val input{width:74px;border:1px solid #e5e7eb;border-radius:4px;padding:2px 5px;font:inherit;font-size:12px;text-align:right;color:#111827;background:#fff}
.val input:focus{outline:none;border-color:#9ca3af}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;display:block}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:#e5e7eb;border-radius:2px}
input[type=range]::-moz-range-track{height:3px;background:#e5e7eb;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;border:1.5px solid #6b7280;margin-top:-5px}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:1.5px solid #6b7280}
input[type=range]:disabled{opacity:.45;cursor:not-allowed}
select{border:1px solid #e5e7eb;border-radius:5px;padding:4px 6px;font:inherit;font-size:12.5px;background:#fff;color:#111827;width:100%}
.check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#374151;cursor:pointer;margin-bottom:8px;user-select:none}
.check:last-child{margin-bottom:0}
.check input{width:14px;height:14px;margin:0;accent-color:#111827;cursor:pointer}
.output{margin-top:14px;padding:13px 15px 15px}
.ohead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.stats{font-size:12.5px;color:#6b7280;font-variant-numeric:tabular-nums}
.stats b{color:#111827;font-weight:600}
.acts{display:flex;gap:8px}
#out{width:100%;height:208px;resize:vertical;border:1px solid #e5e7eb;border-radius:6px;background:#fafbfc;padding:11px 12px;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;color:#1f2937;white-space:pre;overflow:auto;display:block}
#out:focus{outline:none;border-color:#9ca3af}
.warn{margin-top:8px;font-size:12px;color:#b45309;display:none}
.warn.show{display:block}
@media (min-width:901px){
  .controls{max-height:582px;overflow-y:auto;overscroll-behavior:contain}
  .controls::-webkit-scrollbar{width:8px}
  .controls::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:4px}
  .controls::-webkit-scrollbar-track{background:transparent}
}
@media (max-width:900px){
  .main{grid-template-columns:1fr}
  #view{height:380px}
  .app{padding:16px 12px 32px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>图片转 CAD 指令</h1>
    <span class="sub">导入图片 → 提取中心线与轮廓 → 复制指令到 CAD 命令行</span>
    <button class="about-btn" id="aboutBtn" type="button" aria-haspopup="dialog">关于</button>
  </header>

  <div class="main">
    <div class="card preview">
      <canvas id="view"></canvas>
      <div class="empty" id="empty"><div class="drop" id="drop">
        <div class="big">拖入图片，或点击这里选择</div>
        <div class="small">也可以直接 Ctrl + V 粘贴截图</div>
      </div></div>
      <div class="tools">
        <input type="file" id="file" accept="image/*" hidden>
        <button class="btn" id="pick">选择图片</button>
        <div class="seg" id="segBg">
          <button data-v="0" class="on">原图</button>
          <button data-v="1">二值图</button>
          <button data-v="2">无底图</button>
        </div>
        <span class="meta" id="imgMeta"></span>
      </div>
    </div>

    <div class="card controls">
      <div class="group">
        <div class="gtitle">识别</div>
        <div class="row">
          <div class="rhead"><label for="res">处理精度</label></div>
          <select id="res">
            <option value="600">600 px（最快）</option>
            <option value="1000" selected>1000 px（推荐）</option>
            <option value="1400">1400 px（更细）</option>
            <option value="2000">2000 px（最细）</option>
          </select>
        </div>
        <div class="row">
          <div class="check"><input type="checkbox" id="autoTh" checked><span>阈值自动计算（Otsu）</span></div>
        </div>
        <div class="row">
          <div class="rhead"><label for="th">二值化阈值</label><span class="val" id="thV">—</span></div>
          <input type="range" id="th" min="1" max="254" value="128" disabled>
        </div>
        <div class="row">
          <div class="check"><input type="checkbox" id="inv"><span>浅色为墨（反色）</span></div>
        </div>
        <div class="row">
          <div class="rhead"><label for="blur">降噪模糊半径</label><span class="val" id="blurV">0</span></div>
          <input type="range" id="blur" min="0" max="4" step="1" value="1">
        </div>
        <div class="row">
          <div class="rhead"><label for="morph">形态学修整</label></div>
          <select id="morph">
            <option value="0">不处理</option>
            <option value="1" selected>闭运算（补线条断点）</option>
            <option value="2">开运算（去杂点）</option>
            <option value="3">闭 + 开</option>
          </select>
        </div>
      </div>

      <div class="group">
        <div class="gtitle">轮廓</div>
        <div class="row">
          <div class="rhead"><label for="minArea">最小面积</label><span class="val" id="minAreaV">24 px²</span></div>
          <input type="range" id="minArea" min="0" max="600" step="1" value="24">
        </div>
        <div class="row">
          <div class="rhead"><label for="eps">拟合容差（越小越贴合）</label><span class="val" id="epsV">1 px</span></div>
          <input type="range" id="eps" min="0.2" max="6" step="0.1" value="1">
        </div>
        <div class="row">
          <div class="check"><input type="checkbox" id="holes" checked><span>包含内部轮廓（眼睛、花纹等）</span></div>
          <div class="check"><input type="checkbox" id="outerOnly"><span>只要最外层轮廓</span></div>
        </div>
      </div>

      <div class="group">
        <div class="gtitle">图元</div>
        <div class="row">
          <div class="rhead"><label for="mode">输出方式</label></div>
          <select id="mode">
            <option value="prim" selected>直线 LINE + 圆弧 ARC（推荐）</option>
            <option value="pline">多段线 PLINE（忠实轮廓）</option>
          </select>
        </div>
        <div class="row">
          <div class="rhead"><label for="thin">线条取中心线（宽度 ≤）</label><span class="val" id="thinV">6 px</span></div>
          <input type="range" id="thin" min="0" max="24" step="1" value="12">
        </div>
        <div class="row">
          <div class="check"><input type="checkbox" id="circle" checked><span>整圆识别为 CIRCLE</span></div>
        </div>
        <div class="row">
          <div class="rhead"><label for="ctol">圆拟合容差</label><span class="val" id="ctolV">3%</span></div>
          <input type="range" id="ctol" min="0.5" max="10" step="0.5" value="3">
        </div>
      </div>

      <div class="group">
        <div class="gtitle">输出</div>
        <div class="row">
          <div class="rhead"><label for="scale">缩放</label><span class="val"><input type="number" id="scale" value="0.5" min="0.0001" step="0.01"><span id="unitTxt"> mm/px</span></span></div>
        </div>
        <div class="row">
          <div class="rhead"><label for="unit">单位</label></div>
          <select id="unit">
            <option value="4" selected>毫米</option>
            <option value="1">英寸</option>
            <option value="0">无单位</option>
          </select>
        </div>
        <div class="row">
          <div class="check"><input type="checkbox" id="prefix" checked><span>命令加英文前缀 _</span></div>
          <div class="check"><input type="checkbox" id="insu" checked><span>开头插入单位设置</span></div>
          <div class="check"><input type="checkbox" id="zoom" checked><span>末尾自动缩放显示</span></div>
          <div class="check"><input type="checkbox" id="revHole"><span>反转内孔方向</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="card output">
    <div class="ohead">
      <div class="stats" id="stats">尚未导入图片</div>
      <div class="acts">
        <button class="btn primary" id="copy" disabled>复制指令</button>
        <button class="btn" id="scr" disabled>下载 .scr</button>
        <button class="btn" id="txt" disabled>下载 .txt</button>
      </div>
    </div>
    <textarea id="out" readonly spellcheck="false" placeholder="CAD 指令会显示在这里：全选复制 → 粘贴到 CAD 命令行 → 按空格 / 回车即可绘制"></textarea>
    <div class="warn" id="warn"></div>
  </div>
</div>

<script id="core">
var DX = [1, 0, -1, 0];
var DY = [0, 1, 0, -1];
var TRANS = [];
TRANS[0] = [];
TRANS[8] = [[1, 2]];
TRANS[4] = [[2, 3]];
TRANS[2] = [[3, 0]];
TRANS[1] = [[0, 1]];
TRANS[12] = [[2, 2]];
TRANS[9] = [[1, 1]];
TRANS[6] = [[3, 3]];
TRANS[3] = [[0, 0]];
TRANS[10] = [[1, 2], [3, 0]];
TRANS[5] = [[2, 3], [0, 1]];
TRANS[14] = [[3, 2]];
TRANS[13] = [[2, 1]];
TRANS[11] = [[1, 0]];
TRANS[7] = [[0, 3]];
TRANS[15] = [];

function solve3(A, b) {
  var m = [[A[0][0], A[0][1], A[0][2], b[0]], [A[1][0], A[1][1], A[1][2], b[1]], [A[2][0], A[2][1], A[2][2], b[2]]];
  var i, r, j, k, t, f, s;
  for (i = 0; i < 3; i++) {
    var p = i;
    for (r = i + 1; r < 3; r++) if (Math.abs(m[r][i]) > Math.abs(m[p][i])) p = r;
    if (Math.abs(m[p][i]) < 1e-12) return null;
    t = m[i]; m[i] = m[p]; m[p] = t;
    for (j = i + 1; j < 3; j++) {
      f = m[j][i] / m[i][i];
      for (k = i; k < 4; k++) m[j][k] -= f * m[i][k];
    }
  }
  var x = [0, 0, 0];
  for (i = 2; i >= 0; i--) {
    s = m[i][3];
    for (k = i + 1; k < 3; k++) s -= m[i][k] * x[k];
    x[i] = s / m[i][i];
  }
  return x;
}

function toGray(data, n, invert) {
  var g = new Uint8ClampedArray(n);
  for (var i = 0; i < n; i++) {
    var o = i << 2;
    var a = data[o + 3] / 255;
    var r = data[o] * a + 255 * (1 - a);
    var q = data[o + 1] * a + 255 * (1 - a);
    var b = data[o + 2] * a + 255 * (1 - a);
    var v = 0.299 * r + 0.587 * q + 0.114 * b;
    g[i] = invert ? 255 - v : v;
  }
  return g;
}

function boxBlur(src, w, h, r) {
  if (r < 1) return src;
  var tmp = new Float32Array(w * h);
  var out = new Uint8ClampedArray(w * h);
  var d = r * 2 + 1;
  var y, x, i, row, sum, sum2;
  for (y = 0; y < h; y++) {
    row = y * w;
    sum = 0;
    for (i = -r; i <= r; i++) sum += src[row + Math.min(w - 1, Math.max(0, i))];
    for (x = 0; x < w; x++) {
      tmp[row + x] = sum / d;
      sum -= src[row + Math.min(w - 1, Math.max(0, x - r))];
      sum += src[row + Math.min(w - 1, Math.max(0, x + r + 1))];
    }
  }
  for (x = 0; x < w; x++) {
    sum2 = 0;
    for (i = -r; i <= r; i++) sum2 += tmp[Math.min(h - 1, Math.max(0, i)) * w + x];
    for (y = 0; y < h; y++) {
      out[y * w + x] = sum2 / d;
      sum2 -= tmp[Math.min(h - 1, Math.max(0, y - r)) * w + x];
      sum2 += tmp[Math.min(h - 1, Math.max(0, y + r + 1)) * w + x];
    }
  }
  return out;
}

function otsu(gray) {
  var hist = new Float64Array(256), i;
  for (i = 0; i < gray.length; i++) hist[gray[i]]++;
  var total = gray.length, sum = 0;
  for (i = 0; i < 256; i++) sum += i * hist[i];
  var sumB = 0, wB = 0, best = -1, thr = -1;
  for (i = 0; i < 256; i++) {
    wB += hist[i];
    if (wB === 0) continue;
    var wF = total - wB;
    if (wF === 0) break;
    sumB += i * hist[i];
    var mB = sumB / wB, mF = (sum - sumB) / wF;
    var between = wB * wF * (mB - mF) * (mB - mF);
    // A split is only meaningful if both classes carry a real share of the
    // image. Without this guard a thin-line scan (a few dark pixels in a huge
    // white field) maximizes variance at the very first bin and yields thr=1,
    // which erases the line instead of segmenting it.
    var frac = wB / total;
    if (frac < 0.0005 || frac > 0.9995) continue;
    if (between > best) { best = between; thr = i; }
  }
  if (thr < 0) {
    // No usable bimodality (flat or near-uniform image): fall back to the mean.
    thr = Math.round(sum / total);
  }
  return Math.min(254, Math.max(1, thr));
}

function binarize(gray, thr) {
  var n = gray.length, bin = new Uint8Array(n);
  // Threshold landing exactly on the foreground level would drop a thin line
  // entirely (every pixel compares equal). Nudge onto the darker side of the
  // histogram bin so borderline strokes survive.
  var t = thr;
  if (t > 0 && t < 255) {
    var atOrAbove = 0;
    for (var k = 0; k < n; k += 97) if (gray[k] >= t) atOrAbove++;
    var below = 0;
    for (var k2 = 0; k2 < n; k2 += 97) if (gray[k2] < t) below++;
    // if nothing would be marked, include the equal-valued pixels
    if (below === 0) t = t + 1;
  }
  for (var i = 0; i < n; i++) bin[i] = gray[i] < t ? 1 : 0;
  return bin;
}

function morph(bin, w, h, mode) {
  function pass(src, horizontal, dilate) {
    var out = new Uint8Array(w * h);
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var v = horizontal ? src[y * w + x] : src[x * w + y];
        var a = horizontal ? src[y * w + Math.max(0, x - 1)] : src[Math.max(0, x - 1) * w + y];
        var b = horizontal ? src[y * w + Math.min(w - 1, x + 1)] : src[Math.min(w - 1, x + 1) * w + y];
        out[horizontal ? y * w + x : x * w + y] = dilate ? (v || a || b ? 1 : 0) : (v && a && b ? 1 : 0);
      }
    }
    return out;
  }
  function dilate(src) { return pass(pass(src, true, true), false, true); }
  function erode(src) { return pass(pass(src, true, false), false, false); }
  var r = bin;
  if (mode === 1 || mode === 3) r = erode(dilate(r));
  if (mode === 2 || mode === 3) r = dilate(erode(r));
  return r;
}

function traceContours(bin, w, h) {
  var vw = w + 1;
  var size = vw * (h + 1) * 4;
  var next = new Int8Array(size);
  next.fill(-1);
  var starts = [];
  var x, y, a, b, c, d, t, k, base, sx, sy;
  for (y = 0; y <= h; y++) {
    for (x = 0; x <= w; x++) {
      a = (x > 0 && y > 0) ? bin[(y - 1) * w + x - 1] : 0;
      b = (x < w && y > 0) ? bin[(y - 1) * w + x] : 0;
      c = (x < w && y < h) ? bin[y * w + x] : 0;
      d = (x > 0 && y < h) ? bin[y * w + x - 1] : 0;
      t = TRANS[a * 8 + b * 4 + c * 2 + d];
      if (!t) continue;
      base = (y * vw + x) * 4;
      for (k = 0; k < t.length; k++) {
        next[base + t[k][0]] = t[k][1];
        sx = x - DX[t[k][0]];
        sy = y - DY[t[k][0]];
        starts.push((sy * vw + sx) * 4 + t[k][0]);
      }
    }
  }
  var used = new Uint8Array(size);
  var loops = [];
  for (var si = 0; si < starts.length; si++) {
    var s = starts[si];
    if (used[s]) continue;
    var cell = s >> 2;
    var y0 = (cell / vw) | 0;
    var x0 = cell - y0 * vw;
    var d0 = s & 3;
    var pts = [x0, y0];
    var px = x0, py = y0, pd = d0;
    used[s] = 1;
    var guard = size + 16;
    while (guard-- > 0) {
      px += DX[pd];
      py += DY[pd];
      if (px === x0 && py === y0) break;
      pts.push(px, py);
      var e = (py * vw + px) * 4 + pd;
      var nd = next[e];
      if (nd < 0) break;
      var nk = (py * vw + px) * 4 + nd;
      if (used[nk]) break;
      used[nk] = 1;
      pd = nd;
    }
    if (pts.length >= 6) loops.push(pts);
  }
  return loops;

function lineErr(p, i, j) {

function norm2pi(t) {

          if (Math.hypot(ip[0] - p2[0], ip[1] - p2[1]) > maxGap) continue;
          if (e1) { A[2] = ip[0]; A[3] = ip[1]; } else { A[0] = ip[0]; A[1] = ip[1]; }

// Intersection of two rays given as point + unit direction.

  var den = adx * bdy - ady * bdx;

}

      if (yb < 0) yb += 360;
      lines.push(pf + 'ARC ' + fmtNum(tx(e.cx), dig) + ',' + fmtNum(ty(e.cy), dig) + ' ' +
        fmtNum(e.r * scale, dig) + ' ' + fmtAng(ya) + ' ' + fmtAng(yb));
    } else {
      var q = e.pts, parts = [];
      for (var t = 0; t < q.length; t += 2) parts.push(fmtNum(tx(q[t]), dig) + ',' + fmtNum(ty(q[t + 1]), dig));
      if (e.type === 'LINE') {
        lines.push(pf + 'LINE ' + parts[0] + ' ' + parts[1]);
      } else {
        lines.push(pf + 'PLINE ' + parts.join(' ') + (e.closed ? ' C' : ''));
      }
    }
  }
  if (o.zoom && lines.length) {
    lines.push((pf ? '_.' : '') + 'ZOOM');
    lines.push('E');
  }
  return lines;
}

globalThis.Image2Cad = {
  DX: DX, DY: DY, TRANS: TRANS, solve3: solve3, toGray: toGray, boxBlur: boxBlur,
  otsu: otsu, binarize: binarize, morph: morph, traceContours: traceContours,
  signedArea: signedArea, bbox: bbox, dropCollinear: dropCollinear,
  rdpRange: rdpRange, simplifyClosed: simplifyClosed, mergeSegments: mergeSegments,
  fitCircle: fitCircle, caliperWidths: caliperWidths, insetRadius: insetRadius,
  loopIsThin: loopIsThin, rasterizeLoop: rasterizeLoop, distanceTransform: distanceTransform,
  strokeCenterline: strokeCenterline, strokePaths: strokePaths,
  polyLength: polyLength, resampleClosed: resampleClosed,
  lineErr: lineErr, arcFitRange: arcFitRange, segmentize: segmentize,
  buildEntities: buildEntities, fmtNum: fmtNum, fmtAng: fmtAng, toCommands: toCommands
};
</script>

<script>
(function () {
  var C = globalThis.Image2Cad;
  function $(id) { return document.getElementById(id); }

  var view = $('view'), ctx = view.getContext('2d');
  var empty = $('empty'), drop = $('drop'), fileInput = $('file');
  var out = $('out'), stats = $('stats'), warn = $('warn'), imgMeta = $('imgMeta');
  var copyBtn = $('copy'), scrBtn = $('scr'), txtBtn = $('txt');

  var state = {
    src: null, name: '', pw: 0, ph: 0, ow: 0, oh: 0,
    binCanvas: null, bg: 0, vm: { s: 1, x: 0, y: 0 },
    vec: null, text: '', busy: false, pending: false
  };

  var IDS = ['res', 'autoTh', 'th', 'inv', 'blur', 'morph', 'minArea', 'eps', 'holes', 'outerOnly', 'mode', 'thin', 'circle', 'ctol', 'scale', 'unit', 'prefix', 'insu', 'zoom', 'revHole'];
  function get(id) { return $(id); }

  function syncLabels() {
    $('blurV').textContent = get('blur').value;
    $('minAreaV').textContent = get('minArea').value + ' px²';
    $('epsV').textContent = (+get('eps').value).toFixed(1) + ' px';
    $('ctolV').textContent = (+get('ctol').value).toFixed(1) + '%';
    $('thinV').textContent = (+get('thin').value) === 0 ? '关闭' : get('thin').value + ' px';
    get('th').disabled = get('autoTh').checked;
    if (!get('autoTh').checked) $('thV').textContent = get('th').value;
    var u = get('unit').value;
    $('unitTxt').textContent = u === '4' ? ' mm/px' : u === '1' ? ' in/px' : ' 单位/px';
  }

  function fitView() {
    if (!state.pw) return;
    var cw = view.clientWidth, ch = view.clientHeight;
    var s = Math.min(cw / state.pw, ch / state.ph) * 0.9;
    state.vm = { s: s, x: (cw - state.pw * s) / 2, y: (ch - state.ph * s) / 2 };
  }

  function render() {
    var dpr = window.devicePixelRatio || 1;
    var cw = view.clientWidth, ch = view.clientHeight;
    var pw = Math.round(cw * dpr), ph = Math.round(ch * dpr);
    if (view.width !== pw || view.height !== ph) { view.width = pw; view.height = ph; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    if (!state.pw) return;
    var vm = state.vm, i, j;
    ctx.save();
    ctx.translate(vm.x, vm.y);
    ctx.scale(vm.s, vm.s);
    if (state.bg === 0 && state.src) {
      ctx.globalAlpha = 0.3;
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(state.src, 0, 0, state.ow, state.oh, 0, 0, state.pw, state.ph);
      ctx.globalAlpha = 1;
    } else if (state.bg === 1 && state.binCanvas) {
      ctx.drawImage(state.binCanvas, 0, 0);
    }
    if (state.vec) {
      ctx.lineWidth = 1.1 / vm.s;
      ctx.lineJoin = 'round';
      for (i = 0; i < state.vec.length; i++) {
        var e = state.vec[i];
        if (e.type === 'CIRCLE') {
          ctx.strokeStyle = '#be123c';
          ctx.beginPath();
          ctx.arc(e.cx, e.cy, e.r, 0, Math.PI * 2);
          ctx.stroke();
        } else if (e.type === 'ARC') {
          ctx.strokeStyle = e.hole ? '#c2410c' : '#7c3aed';
          ctx.beginPath();
          ctx.arc(e.cx, e.cy, e.r, e.a1, e.a2, !e.ccw);
          ctx.stroke();
        } else {
          ctx.strokeStyle = e.hole ? '#c2410c' : '#0f766e';
          ctx.beginPath();
          for (j = 0; j < e.pts.length; j += 2) {
            if (j === 0) ctx.moveTo(e.pts[j], e.pts[j + 1]);
            else ctx.lineTo(e.pts[j], e.pts[j + 1]);
          }
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  function makeBinCanvas(bin, w, h) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var g = c.getContext('2d');
    var im = g.createImageData(w, h);
    for (var i = 0; i < w * h; i++) {
      var v = bin[i] ? 0 : 255;
      im.data[i * 4] = v; im.data[i * 4 + 1] = v; im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255;
    }
    g.putImageData(im, 0, 0);
    return c;
  }

  function run() {
    syncLabels();
    if (!state.src) {
      state.vec = null;
      state.text = '';
      out.value = '';
      stats.textContent = '尚未导入图片';
      copyBtn.disabled = scrBtn.disabled = txtBtn.disabled = true;
      warn.classList.remove('show');
      render();
      return;
    }
    var maxRes = +get('res').value;
    var ow = state.ow, oh = state.oh;
    var k = Math.min(1, maxRes / Math.max(ow, oh));
    var pw = Math.max(8, Math.round(ow * k));
    var ph = Math.max(8, Math.round(oh * k));
    state.pw = pw; state.ph = ph;

    var cv = document.createElement('canvas');
    cv.width = pw; cv.height = ph;
    var g = cv.getContext('2d', { willReadFrequently: true });
    g.imageSmoothingEnabled = true;
    if (k < 1) g.imageSmoothingQuality = 'high';
    g.drawImage(state.src, 0, 0, pw, ph);
    var data = g.getImageData(0, 0, pw, ph).data;

    var gray = C.toGray(data, pw * ph, get('inv').checked);
    gray = C.boxBlur(gray, pw, ph, +get('blur').value);
    var thr = get('autoTh').checked ? C.otsu(gray) : +get('th').value;
    if (get('autoTh').checked) $('thV').textContent = '自动 ' + thr;
    var bin = C.binarize(gray, thr);
    var mm = +get('morph').value;
    if (mm) bin = C.morph(bin, pw, ph, mm);
    state.binCanvas = makeBinCanvas(bin, pw, ph);

    var minArea = +get('minArea').value;
    var includeHoles = get('holes').checked;
    var outerOnly = get('outerOnly').checked;
    var raw = C.traceContours(bin, pw, ph);
    var loops = [];
    for (var i = 0; i < raw.length; i++) {
      var ar = C.signedArea(raw[i]);
      var hole = ar < 0;
      if (hole && (outerOnly || !includeHoles)) continue;
      if (Math.abs(ar) < minArea) continue;
      loops.push({ pts: raw[i], area: Math.abs(ar), hole: hole });
    }
    loops.sort(function (a, b) { return (a.hole ? 1 : 0) - (b.hole ? 1 : 0) || b.area - a.area; });

    var scale = parseFloat(get('scale').value);
    if (!isFinite(scale) || scale <= 0) scale = 0.5;
    var built = C.buildEntities(loops, {
      eps: +get('eps').value,
      mode: get('mode').value,
      thinWidth: +get('thin').value,
      circle: get('circle').checked,
      ctol: +get('ctol').value / 100,
      revHole: get('revHole').checked
    });
    var vecs = built.entities;
    state.vec = vecs;

    var lines = C.toCommands(vecs, {
      pw: pw, ph: ph, scale: scale,
      digits: get('unit').value === '0' ? 3 : 4,
      prefix: get('prefix').checked,
      insunits: get('insu').checked,
      unitCode: get('unit').value,
      zoom: get('zoom').checked
    });
    state.text = lines.join('\n');
    out.value = state.text;

    var total = vecs.length;
    copyBtn.disabled = scrBtn.disabled = txtBtn.disabled = total === 0;
    stats.innerHTML = total === 0
      ? '未识别到轮廓，试试调整阈值或降噪'
      : '轮廓 <b>' + loops.length + '</b>（线条 <b>' + built.nStroke + '</b>） · 圆 <b>' + built.nCircle + '</b> · 直线 <b>' + built.nLine + '</b> · 圆弧 <b>' + built.nArc + '</b> · 多段线 <b>' + built.nPline + '</b> · 指令 <b>' + lines.length + '</b> 行';
    if (total > 6000) {
      warn.textContent = '图形数量偏多，复制后 CAD 可能卡顿。建议提高「拟合容差」或「最小面积」。';
      warn.classList.add('show');
    } else warn.classList.remove('show');

    imgMeta.textContent = state.name + ' · ' + ow + '×' + oh + ' → ' + pw + '×' + ph;
    render();
  }

  var timer = null;
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      timer = null;
      if (state.busy) { state.pending = true; return; }
      try { run(); } catch (e) { stats.textContent = '处理出错：' + e.message; }
    }, 160);
  }

  function loadFile(file) {
    if (!file || !/^image\//.test(file.type)) return;
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      state.src = img;
      state.ow = img.naturalWidth || img.width;
      state.oh = img.naturalHeight || img.height;
      state.name = file.name || '粘贴的图片';
      empty.style.display = 'none';
      state.busy = true;
      try { run(); } catch (e) { stats.textContent = '处理出错：' + e.message; }
      state.busy = false;
      if (state.pending) { state.pending = false; schedule(); }
      fitView();
      render();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      stats.textContent = '这张图片打不开，换一张试试';
    };
    img.src = url;
  }

  $('pick').addEventListener('click', function () { fileInput.click(); });
  drop.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () { loadFile(fileInput.files[0]); fileInput.value = ''; });

  window.addEventListener('dragenter', function (e) { e.preventDefault(); drop.classList.add('over'); });
  window.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over'); });
  window.addEventListener('dragleave', function (e) { e.preventDefault(); if (!e.relatedTarget) drop.classList.remove('over'); });
  window.addEventListener('drop', function (e) {
    e.preventDefault();
    drop.classList.remove('over');
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });
  window.addEventListener('paste', function (e) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image/') === 0) {
        loadFile(items[i].getAsFile());
        e.preventDefault();
        return;
      }
    }
  });

  $('segBg').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    state.bg = +b.dataset.v;
    var kids = this.children;
    for (var i = 0; i < kids.length; i++) kids[i].classList.toggle('on', kids[i] === b);
    render();
  });

  for (var q = 0; q < IDS.length; q++) {
    var el = get(IDS[q]);
    el.addEventListener('input', schedule);
    el.addEventListener('change', schedule);
  }

  function fallbackCopy(done) {
    out.focus();
    out.select();
    out.setSelectionRange(0, out.value.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    if (ok) done();
    else {
      copyBtn.textContent = '请手动全选复制';
      setTimeout(function () { copyBtn.textContent = '复制指令'; }, 1800);
    }
  }

  copyBtn.addEventListener('click', function () {
    if (!state.text) return;
    var done = function () {
      copyBtn.textContent = '已复制';
      setTimeout(function () { copyBtn.textContent = '复制指令'; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(state.text).then(done, function () { fallbackCopy(done); });
    } else fallbackCopy(done);
  });

  function download(name, text) {
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function baseName() { return (state.name || 'image').replace(/\.[^.]+$/, '') || 'image'; }
  scrBtn.addEventListener('click', function () { if (state.text) download(baseName() + '.scr', state.text); });
  txtBtn.addEventListener('click', function () { if (state.text) download(baseName() + '_cad.txt', state.text); });

  var drag = null;
  view.addEventListener('mousedown', function (e) {
    drag = { x: e.clientX, y: e.clientY, vx: state.vm.x, vy: state.vm.y };
    view.classList.add('drag');
  });
  window.addEventListener('mouseup', function () { drag = null; view.classList.remove('drag'); });
  window.addEventListener('mousemove', function (e) {
    if (!drag) return;
    state.vm.x = drag.vx + e.clientX - drag.x;
    state.vm.y = drag.vy + e.clientY - drag.y;
    render();
  });
  view.addEventListener('wheel', function (e) {
    if (!state.pw) return;
    e.preventDefault();
    var r = view.getBoundingClientRect();
    var mx = e.clientX - r.left, my = e.clientY - r.top;
    var f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    var ns = Math.min(40, Math.max(0.05, state.vm.s * f));
    state.vm.x = mx - (mx - state.vm.x) * (ns / state.vm.s);
    state.vm.y = my - (my - state.vm.y) * (ns / state.vm.s);
    state.vm.s = ns;
    render();
  }, { passive: false });
  view.addEventListener('dblclick', function () { fitView(); render(); });

  window.addEventListener('resize', function () { fitView(); render(); });
  syncLabels();
  render();
})();
</script>

<div class="about-mask" id="aboutMask" hidden>
  <div class="about" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
    <h2 id="aboutTitle">图片转 CAD 指令</h2>
    <p class="ver">版本 <span id="aboutVer"></span></p>
    <dl>
      <dt>仓库</dt>
      <dd><a id="aboutRepo" href="#" target="_blank" rel="noopener noreferrer"></a></dd>
      <dt>作者</dt>
      <dd id="aboutAuthor"></dd>
    </dl>
    <button class="close" id="aboutClose" type="button">关闭</button>
  </div>
</div>

<script>
(function () {
  // Kept in step with package.json by tests/versions.mjs.
  var VERSION = '0.2.0';
  var AUTHOR = 'PointerNexus';
  var REPO = 'https://github.com/PointerNexus/Image2CAD';

  var btn = document.getElementById('aboutBtn');
  var mask = document.getElementById('aboutMask');
  var close = document.getElementById('aboutClose');
  if (!btn || !mask) return;

  document.getElementById('aboutVer').textContent = VERSION;
  document.getElementById('aboutAuthor').textContent = AUTHOR;
  var repo = document.getElementById('aboutRepo');
  repo.textContent = REPO;
  repo.href = REPO;

  var lastFocus = null;
  function open() {
    lastFocus = document.activeElement;
    mask.hidden = false;
    mask.classList.add('on');
    close.focus();
  }
  function hide() {
    mask.classList.remove('on');
    mask.hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  btn.addEventListener('click', open);
  close.addEventListener('click', hide);
  // click on the backdrop itself, not the panel
  mask.addEventListener('click', function (e) { if (e.target === mask) hide(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !mask.hidden) hide();
  });
})();
</script>
</body>
</html>
